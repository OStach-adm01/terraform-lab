---
- name: Update the APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Ensure QEMU Guest Agent is enabled and running
  ansible.builtin.service:
    name: qemu-guest-agent
    enabled: true
    state: started

- name: Configure the system timezone
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ common_timezone }}"
    dest: /etc/localtime
    owner: root
    group: root
    state: link
    force: true

- name: Record the system timezone
  ansible.builtin.copy:
    content: "{{ common_timezone }}\n"
    dest: /etc/timezone
    owner: root
    group: root
    mode: "0644"

- name: Create the systemd-timesyncd configuration directory
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Configure systemd-timesyncd
  ansible.builtin.template:
    src: timesyncd.conf.j2
    dest: /etc/systemd/timesyncd.conf.d/99-terraform-lab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-timesyncd

- name: Ensure systemd-timesyncd is enabled and running
  ansible.builtin.service:
    name: systemd-timesyncd
    enabled: true
    state: started
