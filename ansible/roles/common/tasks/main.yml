---
- name: Update the APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Ensure QEMU Guest Agent is enabled and running
  ansible.builtin.service:
    name: qemu-guest-agent
    enabled: true
    state: started
