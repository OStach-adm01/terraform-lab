---
- name: Verify the supported operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_release == "noble"
      - ansible_architecture == "x86_64"
    fail_msg: >-
      The kubernetes_node role supports only Ubuntu 24.04
      on the x86_64 architecture
    success_msg: >-
      The host runs supported Ubuntu 24.04 on x86_64

- name: Check whether containerd is already installed
  ansible.builtin.stat:
    path: /usr/bin/containerd
  register: kubernetes_node_containerd_binary

- name: Check whether the containerd configuration directory exists
  ansible.builtin.stat:
    path: /etc/containerd
  register: kubernetes_node_containerd_directory

- name: Check whether the containerd configuration file exists
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: kubernetes_node_containerd_config_file

- name: Install Kubernetes node packages
  ansible.builtin.apt:
    name: "{{ kubernetes_node_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure required kernel modules
  ansible.builtin.template:
    src: kubernetes-modules.conf.j2
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: "0644"

- name: Load required kernel modules
  ansible.builtin.command:
    cmd: "/usr/sbin/modprobe {{ item }}"
    creates: "/sys/module/{{ item }}"
  loop: "{{ kubernetes_node_kernel_modules }}"

- name: Configure Kubernetes sysctl parameters
  ansible.builtin.template:
    src: 99-kubernetes.conf.j2
    dest: /etc/sysctl.d/99-kubernetes.conf
    owner: root
    group: root
    mode: "0644"

- name: Apply Kubernetes sysctl parameters to the running kernel
  when: not ansible_check_mode
  block:
    - name: Read current Kubernetes sysctl parameters
      ansible.builtin.command:
        argv:
          - /usr/sbin/sysctl
          - -n
          - "{{ item.key }}"
      loop: "{{ kubernetes_node_sysctl_parameters | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: kubernetes_node_current_sysctl
      changed_when: false

    - name: Set required Kubernetes sysctl parameters
      ansible.builtin.command:
        argv:
          - /usr/sbin/sysctl
          - -w
          - "{{ item.item.key }}={{ item.item.value }}"
      loop: "{{ kubernetes_node_current_sysctl.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: item.stdout | trim != item.item.value
      changed_when: true

- name: Disable swap persistently
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([ \t]*)([^#\n]+[ \t]+[^ \t\n]+[ \t]+swap[ \t]+.*)$'
    replace: '\1# \2'
    backup: true
  when: not kubernetes_swap_enabled

- name: Disable active swap
  ansible.builtin.command:
    cmd: /usr/sbin/swapoff -a
  when:
    - not kubernetes_swap_enabled
    - ansible_swaptotal_mb > 0
  changed_when: true

- name: Check for active swap
  ansible.builtin.command:
    cmd: /usr/sbin/swapon --show --noheadings
  register: kubernetes_node_active_swap
  changed_when: false
  when:
    - not kubernetes_swap_enabled
    - not ansible_check_mode

- name: Verify that swap is disabled
  ansible.builtin.assert:
    that:
      - kubernetes_node_active_swap.stdout | trim | length == 0
    fail_msg: Active swap remains enabled on the Kubernetes node
    success_msg: Swap is disabled on the Kubernetes node
  when:
    - not kubernetes_swap_enabled
    - not ansible_check_mode

- name: Ensure the containerd configuration directory exists
  ansible.builtin.file:
    path: /etc/containerd
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Configure containerd
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/containerd --config %s config dump
  notify: Restart containerd
  when: >-
    not ansible_check_mode
    or (
      kubernetes_node_containerd_binary.stat.exists
      and kubernetes_node_containerd_directory.stat.exists
    )

- name: Ensure containerd is enabled and running
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started
  when: >-
    not ansible_check_mode
    or kubernetes_node_containerd_binary.stat.exists

- name: Apply pending Kubernetes node handlers
  ansible.builtin.meta: flush_handlers

- name: Read the effective containerd configuration
  ansible.builtin.command:
    cmd: /usr/bin/containerd config dump
  register: kubernetes_node_containerd_config
  changed_when: false
  when: >-
    not ansible_check_mode
    or (
      kubernetes_node_containerd_binary.stat.exists
      and kubernetes_node_containerd_config_file.stat.exists
    )

- name: Verify the containerd cgroup driver
  ansible.builtin.assert:
    that:
      - '"SystemdCgroup = true" in kubernetes_node_containerd_config.stdout'
    fail_msg: Containerd is not configured to use the systemd cgroup driver
    success_msg: Containerd uses the systemd cgroup driver
  when: >-
    not ansible_check_mode
    or (
      kubernetes_node_containerd_binary.stat.exists
      and kubernetes_node_containerd_config_file.stat.exists
    )

- name: Read the containerd plugin status
  ansible.builtin.command:
    cmd: /usr/bin/ctr plugins list
  register: kubernetes_node_containerd_plugins
  changed_when: false
  when: >-
    not ansible_check_mode
    or (
      kubernetes_node_containerd_binary.stat.exists
      and kubernetes_node_containerd_config_file.stat.exists
    )

- name: Verify that the containerd CRI plugin is active
  ansible.builtin.assert:
    that:
      - >-
        kubernetes_node_containerd_plugins.stdout
        is search('(?m)^io[.]containerd[.]grpc[.]v1[ \t]+cri[ \t]+[^ \t]+[ \t]+ok[ \t]*$')
    fail_msg: The containerd CRI plugin is not active
    success_msg: The containerd CRI plugin is active
  when: >-
    not ansible_check_mode
    or (
      kubernetes_node_containerd_binary.stat.exists
      and kubernetes_node_containerd_config_file.stat.exists
    )

- name: Ensure the APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Download the Kubernetes repository signing key
  ansible.builtin.get_url:
    url: >-
      https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version.split('.')[0] }}.{{ kubernetes_version.split('.')[1] }}/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure the Kubernetes APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc]
      https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version.split('.')[0] }}.{{ kubernetes_version.split('.')[1] }}/deb/ /
    filename: kubernetes
    state: present
    mode: "0644"
    update_cache: false

- name: Update the APT cache after configuring the Kubernetes repository
  ansible.builtin.apt:
    update_cache: true
  when: not ansible_check_mode

- name: Install pinned Kubernetes packages
  ansible.builtin.apt:
    name: "{{ item }}={{ kubernetes_node_kubernetes_package_version }}"
    state: present
  loop: "{{ kubernetes_node_kubernetes_packages }}"
  when: not ansible_check_mode

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_node_kubernetes_packages }}"
  when: not ansible_check_mode

- name: Ensure kubelet is enabled at boot
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
  when: not ansible_check_mode

- name: Read installed Kubernetes package versions
  ansible.builtin.command:
    argv:
      - /usr/bin/dpkg-query
      - --show
      - '--showformat=${Version}'
      - "{{ item }}"
  loop: "{{ kubernetes_node_kubernetes_packages }}"
  register: kubernetes_node_installed_packages
  changed_when: false
  when: not ansible_check_mode

- name: Verify installed Kubernetes package versions
  ansible.builtin.assert:
    that:
      - item.stdout == kubernetes_node_kubernetes_package_version
    fail_msg: >-
      Package {{ item.item }} has version {{ item.stdout }},
      expected {{ kubernetes_node_kubernetes_package_version }}
    success_msg: >-
      Package {{ item.item }} has the expected version
      {{ kubernetes_node_kubernetes_package_version }}
  loop: "{{ kubernetes_node_installed_packages.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode
